<!doctype html>
<meta charset="utf-8" />
<title>LinkScout options</title>
<style>
  body { font: 14px system-ui; padding: 16px; max-width: 520px; }
  label { display: block; margin: 12px 0 4px; }
  input, textarea, select { width: 100%; box-sizing: border-box; font: inherit; }
  input[type="checkbox"] { width: auto; }
  textarea { min-height: 9em; }
  textarea.short { min-height: 6em; }
  .hint { color: #5f6368; font-size: 12px; margin: 4px 0 0; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .brand img { width: 48px; height: 48px; }
  .brand h1 { margin: 0; font-size: 24px; color: #142d42; letter-spacing: -0.6px; }
</style>
<header class="brand">
  <img src="icons/logo.svg" alt="" width="48" height="48" />
  <h1>LinkScout</h1>
</header>
<!-- Text comes from STRINGS in options.js, by data-i18n key, in the chosen UI language. -->
<label><span data-i18n="uiLanguage"></span>
  <select id="uiLanguage">
    <option value="auto" data-i18n="uiAuto"></option>
    <option value="en">English</option>
    <option value="zh">中文（繁體）</option>
  </select>
</label>
<p class="hint" data-i18n="uiLanguageHint"></p>

<label>Worker URL <input id="workerUrl" placeholder="https://linkscout-worker.<you>.workers.dev" /></label>
<label>Token <input id="token" type="password" /></label>

<label><input id="fastMode" type="checkbox" /> <span data-i18n="fastMode"></span></label>
<p class="hint" data-i18n="fastModeHint"></p>

<label><input id="reorder" type="checkbox" /> <span data-i18n="reorder"></span></label>
<p class="hint" data-i18n="reorderHint"></p>

<div id="translateOption">
  <label><input id="autoTranslate" type="checkbox" /> <span data-i18n="autoTranslate"></span></label>
  <p class="hint" data-i18n="autoTranslateHint"></p>
</div>

<label><input id="monitorMode" type="checkbox" /> <span data-i18n="monitorMode"></span></label>
<p class="hint" data-i18n="monitorModeHint"></p>

<label for="monitorProfile" data-i18n="monitorProfile"></label>
<textarea id="monitorProfile" maxlength="2000" data-i18n-placeholder="monitorProfilePlaceholder"></textarea>
<p class="hint" data-i18n="monitorProfileHint"></p>

<label for="monitorInclude" data-i18n="monitorInclude"></label>
<textarea id="monitorInclude" class="short" maxlength="1200" data-i18n-placeholder="monitorIncludePlaceholder"></textarea>
<label for="monitorExclude" data-i18n="monitorExclude"></label>
<textarea id="monitorExclude" class="short" maxlength="1200" data-i18n-placeholder="monitorExcludePlaceholder"></textarea>
<p class="hint" data-i18n="monitorExamplesHint"></p>

<p><span id="markCount"></span> <button id="exportMarks" data-i18n="exportMarks"></button> <button id="clearMarks" data-i18n="clearMarks"></button></p>
<p class="hint" data-i18n="marksHint"></p>

<label for="jobProfile" data-i18n="jobProfile"></label>
<textarea id="jobProfile" maxlength="2000" data-i18n-placeholder="jobProfilePlaceholder"></textarea>
<p class="hint" data-i18n="jobProfileHint"></p>

<p><button id="save" data-i18n="save"></button> <span id="status"></span></p>
<script src="i18n.js"></script>
<script src="options.js"></script>
